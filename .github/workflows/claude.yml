name: Claude Code

# Responds when kaushiknaresh47 writes "@claude" in an issue, a pull request
# comment, or a pull request review. Mentions by anyone else are ignored.
# Authenticates with a Claude subscription via the CLAUDE_CODE_OAUTH_TOKEN
# repository secret.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Skip the run entirely unless the trigger phrase is present AND the person
    # who wrote it is the repository owner. Nobody else can start a run, so
    # comments from other users — and from claude[bot] itself — are ignored.
    if: |
      github.actor == 'kaushiknaresh47' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(npm run dev),Bash(npm start)"
